name: Verify calendar studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # Runner-installed Chrome has an AppArmor profile; sandboxing stays enabled.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /opt/google/chrome/chrome
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" && "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-test-evidence
          path: test-results
          retention-days: 7
